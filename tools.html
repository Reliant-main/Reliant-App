<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Computer tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg: #0e1915; --surface: #15231e; --surface-2: #1b2c26; --ink: #eef0ea; --ink-2: #c0c6bd; --muted: #8d978f;
  --line: rgba(255,255,255,.10); --accent: #7fc7a6; --accent-wash: rgba(127,199,166,.10); --gilt: #d2a54a;
  --good: #2fbf4f; --bad: #ef6b6b; --warnbg: #3a2e12; --warnfg: #f2c35a; --badbg: #3a1d1d;
  --f-display: "Libre Caslon Display", Georgia, serif;
  --f-ui: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--f-ui); }
.wrap { max-width: 1000px; margin: 0 auto; padding: 20px clamp(14px, 3vw, 32px) 56px; display: flex; flex-direction: column; gap: 18px; }
header.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; }
.eyebrow { font: 500 11px var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--gilt); }
h1 { margin: 0; font: 400 clamp(28px, 4vw, 40px)/1.05 var(--f-display); }
.sub { font-size: 14px; color: var(--muted); margin: 4px 0 0; max-width: 62ch; }
.btn { font: 500 13px var(--f-ui); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; cursor: pointer; text-decoration: none; display: inline-block; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: #0e1915; border-color: var(--accent); font-weight: 600; }
.btn:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.notice { border-radius: 10px; padding: 12px 16px; background: var(--warnbg); color: var(--warnfg); font-size: 14px; }
.notice.bad { background: var(--badbg); color: var(--bad); }
.tool { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
.tool.behind { border-color: var(--bad); }
.th { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: flex-start; justify-content: space-between; }
.th h2 { margin: 0; font: 400 26px/1.15 var(--f-display); }
.th .what { margin: 4px 0 0; color: var(--ink-2); font-size: 14px; }
.vers { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.vers > div { background: var(--surface-2); padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; }
.k { font: 500 11px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.v { font: 600 18px var(--f-ui); }
.d { font-size: 13px; color: var(--ink-2); }
.ok { color: var(--good); } .bad { color: var(--bad); } .dim { color: var(--muted); }
.row { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 4px 14px; font-size: 14px; }
.row .k { padding-top: 2px; }
details { border-top: 1px solid var(--line); padding-top: 10px; }
summary { cursor: pointer; font: 600 14px var(--f-ui); color: var(--ink-2); }
ol, ul { margin: 8px 0 0; padding-left: 22px; font-size: 14px; display: flex; flex-direction: column; gap: 4px; }
code { font: 13px var(--f-mono); background: var(--bg); padding: 1px 5px; border-radius: 4px; }
#list { display: flex; flex-direction: column; gap: 14px; }
@media (max-width: 600px) { .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <span class="eyebrow">Reliant Distribution</span>
      <h1>Computer tools</h1>
      <p class="sub">Small programs that run on the store's computers. Open this page on the computer you're setting up to see whether its copy is current.</p>
    </div>
    <button class="btn" id="btnRefresh" type="button">Check again</button>
  </header>
  <div class="notice bad" id="err" hidden></div>
  <div id="list"></div>
</div>

<script>
(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const newer = (a, b) => { const x = String(a).split(".").map(Number), y = String(b).split(".").map(Number);
    for (let i = 0; i < Math.max(x.length, y.length); i++) { const d = (x[i] || 0) - (y[i] || 0); if (d) return d > 0; } return false; };

  let tools = [];
  const here = {};   // id -> { version, note } for what this computer has

  // ---- what's on this computer ----
  async function checkChitPrinter() {
    try {
      const r = await fetch("http://127.0.0.1:17861/status", { cache: "no-store", signal: AbortSignal.timeout(2500) });
      const j = await r.json();
      if (j && j.app === "reliant-chit-printer") here["chit-printer"] = { version: j.version || "1.0.0", note: j.printer ? "Printing on " + j.printer : "", updating: j.updating };
    } catch { here["chit-printer"] = { none: true }; }
  }
  // The Page Reader (0.4.1 and later) announces its version on App pages.
  window.addEventListener("message", e => {
    if (e.source !== window || !e.data || !e.data.__reliantTool) return;
    here[e.data.__reliantTool] = { version: e.data.version };
    draw();
  });

  function stateFor(t) {
    const h = here[t.id];
    if (t.id === "chit-printer") {
      if (!h) return { v: "Checking…", d: "", cls: "dim" };
      if (h.none) return { v: "Not running here", d: "Not installed on this computer, or switched off. Only the computer that prints chits needs it.", cls: "dim" };
      if (newer(t.version, h.version)) {
        if (h.version === "1.0.0") return { v: h.version, d: "Update available. Download and run the installer once more; from 1.1.0 on it updates itself.", cls: "bad", behind: true };
        return { v: h.version, d: h.updating ? `Version ${h.updating} is downloaded and goes in once no chit has printed for 1 hour.` : "It will update itself within 6 hours (or restart the computer).", cls: "bad", behind: true };
      }
      return { v: h.version, d: "Up to date. " + (h.note || ""), cls: "ok" };
    }
    if (t.id === "page-reader" || t.id === "scan-helper") {
      if (!h) return t.id === "page-reader"
        ? { v: "Not seen", d: "Not installed in this browser, or older than 0.4.1 (open its menu: 0.4.0 and older show no version). Only the computer running the live page needs it.", cls: "dim" }
        : { v: "Not seen", d: "Not installed in this browser, or older than 0.6.6 (open its menu: older ones show no version). Only the CashMonkey scanning computers need it.", cls: "dim" };
      if (newer(t.version, h.version)) return { v: h.version, d: "Update available. Follow the update steps below.", cls: "bad", behind: true };
      return { v: h.version, d: "Up to date.", cls: "ok" };
    }
    return { v: "—", d: "Check the version in its toolbar menu.", cls: "dim" };
  }

  function draw() {
    $("list").innerHTML = "";
    for (const t of tools) {
      const st = stateFor(t);
      const el = document.createElement("section");
      el.className = "tool" + (st.behind ? " behind" : "");
      const dl = t.file
        ? `<a class="btn primary" href="${esc(t.file)}" download>Download ${esc(t.version)}</a>`
        : `<span class="d">${esc(t.missing || "No download yet.")}</span>`;
      const kind = t.kind === "windows" ? "Windows program" : t.kind === "chrome" ? "Chrome extension" : "";
      const steps = (t.steps || []).length ? `<details><summary>How to install</summary><ol>${t.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol></details>` : "";
      const usteps = (t.update_steps || []).length ? `<details ${st.behind ? "open" : ""}><summary>How to update</summary><ol>${t.update_steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol></details>` : "";
      const changes = (t.changes || []).length ? `<details><summary>What changed</summary><ul>${t.changes.map(s => `<li>${esc(s)}</li>`).join("")}</ul></details>` : "";
      el.innerHTML = `
        <div class="th">
          <div><h2>${esc(t.name)}</h2><p class="what">${esc(t.what)}</p></div>
          <div>${dl}</div>
        </div>
        <div class="vers">
          <div><span class="k">Newest</span><span class="v">${esc(t.version)}</span><span class="d">${esc(kind)}</span></div>
          <div><span class="k">On this computer</span><span class="v ${st.cls}">${esc(st.v)}</span><span class="d">${esc(st.d)}</span></div>
        </div>
        <div class="row"><span class="k">Goes on</span><span>${esc(t.where)}</span></div>
        <div class="row"><span class="k">Updates</span><span>${esc(t.updates)}</span></div>
        ${usteps}${steps}${changes}`;
      $("list").appendChild(el);
    }
  }

  async function load() {
    $("err").hidden = true;
    try {
      const r = await fetch("tools.json", { cache: "no-store" });
      tools = (await r.json()).tools || [];
    } catch (e) { $("err").textContent = "Couldn't load the tools list. Check the internet connection and try again."; $("err").hidden = false; return; }
    delete here["chit-printer"];
    draw();
    window.postMessage({ __reliantToolsAsk: true }, location.origin);
    await checkChitPrinter();
    draw();
  }
  $("btnRefresh").onclick = load;
  load();
})();
</script>
</body>
</html>
